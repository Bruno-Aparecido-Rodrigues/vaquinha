server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Se algum serviço também devolver cabeçalhos de CORS, mantém só um de cada
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:

        # LOGIN - porta 8081 (auth, cadastro, logout e me)
        - id: login-service
          uri: ${LOGIN_URL:http://localhost:8081}
          predicates:
            - Path=/login/**

        # CAMPANHA - porta 8082 (CRUD de vaquinhas)
        - id: campanha-service
          uri: ${CAMPANHA_URL:http://localhost:8082}
          predicates:
            - Path=/campanha/**

        # DOAÇÃO - porta 8083 (doar e listar doações; concorrência + transação)
        - id: doacao-service
          uri: ${DOACAO_URL:http://localhost:8083}
          predicates:
            - Path=/doacao/**

        # RELATÓRIO - porta 8084 (somente ADMIN)
        - id: relatorio-service
          uri: ${RELATORIO_URL:http://localhost:8084}
          predicates:
            - Path=/relatorio/**

jwt:
  # Precisa ser IGUAL à chave do serviço de Login
  secret: ${JWT_SECRET:muuv-vaquinha-chave-secreta-jwt-2026-fatec-microsservicos}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
